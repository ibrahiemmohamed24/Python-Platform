name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Type check
        run: python -m mypy app tests

      - name: Test
        run: python -m pytest

      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: python -m build

      - name: Smoke test built wheel
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --no-deps --target wheel-smoke dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/wheel-smoke" python -c "from app.main import app; assert app.title == 'AI Python QA Platform'"
